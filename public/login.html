<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Masuk — HelsTJ Job Tracker</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171923;background:#f5f6fa;font-synthesis:none;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;grid-template-rows:1fr auto;background:radial-gradient(ellipse at 18% 12%,#e6e1ff 0,transparent 34%),radial-gradient(ellipse at 90% 86%,#dcecff 0,transparent 36%),#f6f7fb}
    main{display:grid;place-items:center;padding:36px 18px}
    .card{width:min(440px,100%);padding:38px;background:#ffffffed;border:1px solid #e5e7f0;border-radius:24px;box-shadow:0 24px 70px #25204a18,0 3px 12px #25204a08;backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .mark{display:grid;place-items:center;width:66px;height:54px;border-radius:17px;background:linear-gradient(140deg,#7654e8,#5331b9);color:#fff;font-size:17px;font-weight:850;letter-spacing:-.06em;box-shadow:0 8px 18px #6844d533}
    .brand-caption{color:#7a718f;font-size:10px;font-weight:750;letter-spacing:.16em}
    h1{margin:0;font-size:27px;letter-spacing:-.045em}
    .intro{margin:9px 0 27px;color:#687086;line-height:1.65}
    label{display:block;margin:17px 0 7px;font-size:13px;font-weight:700;color:#35334a}
    input{width:100%;padding:13px 14px;border:1px solid #d9dce7;border-radius:11px;background:#fff;font:inherit;transition:border-color .16s,box-shadow .16s}
    input:focus{outline:0;border-color:#7654e8;box-shadow:0 0 0 4px #7654e81c}
    .password-field{position:relative}
    .password-field input{padding-right:76px}
    .password-toggle{position:absolute;top:50%;right:7px;transform:translateY(-50%);width:auto;margin:0;padding:7px 9px;border:0;background:transparent;color:#5936bc;font-size:12px;font-weight:700}
    .password-toggle:focus-visible{outline:3px solid #6d45d833;border-radius:6px}
    button{width:100%;margin-top:23px;padding:13px;border:0;border-radius:11px;background:linear-gradient(110deg,#704be0,#5936bd);color:#fff;font:inherit;font-weight:750;cursor:pointer;box-shadow:0 8px 18px #6844d52b;transition:transform .16s,box-shadow .16s}
    button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 11px 22px #6844d538}
    button:disabled{opacity:.65;cursor:wait}
    .message{min-height:21px;margin:12px 0 0;color:#b42318;font-size:13px}
    footer{padding:18px 16px 24px;text-align:center;color:#71778a;font-size:12px;line-height:1.9}
    footer a{color:#5936bc;text-decoration:none;font-weight:650}
    footer a:hover{text-decoration:underline}
    @media(max-width:480px){main{padding:22px 14px}.card{padding:28px 23px;border-radius:20px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="loginTitle">
      <div class="brand">
        <div class="mark" aria-hidden="true">HelsTJ</div>
        <div class="brand-caption">JOB TRACKER</div>
      </div>
      <h1 id="loginTitle">Masuk ke HelsTJ</h1>
      <p class="intro">Gunakan akun tracker untuk melanjutkan ke dashboard lamaran kerja.</p>
      <form id="loginForm">
        <label for="username">Nama pengguna</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Kata sandi</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="passwordToggle" class="password-toggle" type="button" aria-label="Tampilkan kata sandi" aria-pressed="false">Lihat</button>
        </div>
        <button id="submitButton" type="submit">Masuk</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer>
    © 2026 Helmy Akrim · Job Tracker<br>
    <a href="https://github.com/myhell2405" target="_blank" rel="noopener noreferrer">GitHub</a> ·
    <a href="mailto:helmyakrim@gmail.com">Email</a> ·
    <a href="https://hlmykrm.vercel.app" target="_blank" rel="noopener noreferrer">Website</a>
  </footer>
  <script>
    const form=document.getElementById('loginForm');
    const button=document.getElementById('submitButton');
    const message=document.getElementById('message');
    const passwordInput=document.getElementById('password');
    const passwordToggle=document.getElementById('passwordToggle');
    passwordToggle.addEventListener('click',()=>{
      const showing=passwordInput.type==='password';
      passwordInput.type=showing?'text':'password';
      passwordToggle.textContent=showing?'Tutup':'Lihat';
      passwordToggle.setAttribute('aria-label',showing?'Sembunyikan kata sandi':'Tampilkan kata sandi');
      passwordToggle.setAttribute('aria-pressed',String(showing));
      passwordInput.focus();
    });
    fetch('/api/session').then(response=>{
      if(!response.ok)throw new Error(`Server menjawab ${response.status}`);
      return response.json();
    }).then(session=>{
      if(session.authenticated)location.replace('/');
    }).catch(error=>{
      console.error('Status login gagal diperiksa:',error);
      message.textContent='Tidak dapat terhubung ke server. Coba muat ulang halaman.';
    });
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      button.disabled=true;
      message.textContent='Memeriksa akun…';
      try{
        const response=await fetch('/api/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            username:form.elements.username.value,
            password:form.elements.password.value
          })
        });
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||'Nama pengguna atau kata sandi salah.');
        location.replace('/');
      }catch(error){
        console.error('Login gagal:',error);
        message.textContent=error.message;
        button.disabled=false;
      }
    });
  </script>
</body>
</html>
